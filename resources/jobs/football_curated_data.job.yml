resources:
  jobs:
    football_curated_data:
      name: football_curated_data
      tasks:
        - task_key: Curated_Full_Load
          notebook_task:
            notebook_path: code/curated/curated_data
            base_parameters:
              sport: football
            source: GIT
          environment_key: Default
      git_source:
        git_url: https://github.com/ganeshbhrathwaj/BarcaKings_Analytics
        git_provider: gitHub
        git_branch: main
      queue:
        enabled: true
      environments:
        - environment_key: Default
          spec:
            environment_version: "6"
      performance_target: PERFORMANCE_OPTIMIZED
